# C-01 SGBM 基线参数
# 视差搜索范围应由工作距离和相机参数推出（见 oven_stereo.stereo.disparity_range_for_depth），
# 不要按标准答案的视差范围设定。换数据集或分辨率时要重新算。
name: sgbm_c01
min_disparity: 0
num_disparities: 64     # 必须是 16 的倍数；最左边 min_disparity + num_disparities 列一定无效
block_size: 5           # 奇数
p1: 200                 # 8 * 1 通道 * 5^2
p2: 800                 # 32 * 1 通道 * 5^2
disp12_max_diff: 1      # 左右互相校验允许的差（像素）
uniqueness_ratio: 10
speckle_window_size: 100
speckle_range: 2
pre_filter_cap: 63
mode: SGBM
