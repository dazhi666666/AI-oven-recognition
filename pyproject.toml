[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oven-stereo"
version = "0.1.0"
description = "双目立体视觉烤箱深度感知与体积估计"
# 推荐 Python 3.11；精确版本见 requirements-lock.txt
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.3,<2.5",
    "opencv-python-headless>=4.13,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# tests 下各子目录同名测试文件互不冲突
addopts = "--import-mode=importlib"
